<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PaiVoice · 实时语音</title>
    <!--
      PaiVoice 独立通话页（2026-10-20）
      组件来自 tianyupaipai-cmd/pai-voice（AGPL-3.0，见同目录 LICENSE）。
      刻意**不打包进主前端**：这里是独立页面，通过 WebSocket 与 PaiVoice 核心通信。
    -->
    <style>
      :root {
        color-scheme: dark;
        --ink: #f5ece2;
        --muted: #9b8d80;
        --line: rgba(255, 255, 255, 0.09);
        --accent: #e2b57f;
        --accent-soft: rgba(226, 181, 127, 0.16);
        --danger: #e07b7b;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
        background:
          radial-gradient(120% 80% at 50% 0%, #2a1c13 0%, #140e0a 48%, #0a0705 100%);
        color: var(--ink);
        overflow: hidden;
      }
      /* 通话星空：粒子背景铺在内容下层，仅作装饰、不拦截触摸 */
      #sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
      #app { position: relative; z-index: 1; height: 100dvh; display: flex; flex-direction: column; padding: 18px 18px 26px; }
      header { display: flex; align-items: center; gap: 8px; }
      header .dot { width: 7px; height: 7px; border-radius: 99px; background: var(--muted); }
      header .dot.on { background: #7ecb9a; box-shadow: 0 0 8px rgba(126, 203, 154, 0.7); }
      header .dot.wait { background: var(--accent); animation: pulse 1.2s infinite; }
      header .brand { font-size: 10px; letter-spacing: 0.32em; color: var(--muted); }
      header .name { font-size: 13px; margin-left: auto; color: var(--ink); }
      main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
      .stage { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
      .orb {
        position: relative; width: 132px; height: 132px; border-radius: 50%;
        background: radial-gradient(circle at 40% 35%, #f3d2a8 0%, #c78f58 38%, #6b4527 70%, #2a1a10 100%);
        box-shadow: 0 0 50px rgba(226, 181, 127, 0.18), inset 0 0 30px rgba(0, 0, 0, 0.35);
        transition: transform 0.25s ease;
      }
      .orb::before, .orb::after {
        content: ''; position: absolute; inset: -12px; border-radius: 50%;
        border: 1px solid rgba(226, 181, 127, 0.22);
        animation: ring 2.8s ease-out infinite;
      }
      .orb::after { animation-delay: 1.4s; }
      .orb.listening { transform: scale(1.03); }
      .orb.speaking { transform: scale(1.06); box-shadow: 0 0 70px rgba(226, 181, 127, 0.35); }
      .orb.thinking { animation: breathe 1.6s ease-in-out infinite; }
      @keyframes ring { 0% { transform: scale(0.92); opacity: 0.55; } 100% { transform: scale(1.35); opacity: 0; } }
      @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      .state { font-size: 13px; color: var(--muted); min-height: 20px; letter-spacing: 0.06em; }
      .transcript {
        width: 100%; max-height: 36vh; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
        padding: 4px 2px; scrollbar-width: thin;
      }
      .bubble {
        max-width: 86%; padding: 8px 11px; border-radius: 14px; font-size: 13px; line-height: 1.55;
        white-space: pre-wrap; word-break: break-word; border: 1px solid var(--line);
      }
      .bubble.me { align-self: flex-end; background: rgba(226, 181, 127, 0.14); border-color: rgba(226, 181, 127, 0.22); }
      .bubble.ai { align-self: flex-start; background: rgba(255, 255, 255, 0.045); }
      .bubble.sys { align-self: center; background: transparent; border: 0; color: var(--muted); font-size: 11px; padding: 0; }
      .controls { display: flex; align-items: center; justify-content: center; gap: 14px; padding-top: 14px; }
      button {
        font: inherit; color: inherit; border: 0; cursor: pointer; background: transparent;
        -webkit-user-select: none; user-select: none;
      }
      .round {
        width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center;
        border: 1px solid var(--line); background: rgba(255, 255, 255, 0.045); color: var(--ink);
        transition: transform 0.15s ease, background 0.15s ease;
      }
      .round:active { transform: scale(0.94); }
      .round.on { background: var(--accent-soft); border-color: rgba(226, 181, 127, 0.4); color: var(--accent); }
      .round.hangup { background: rgba(224, 123, 123, 0.16); border-color: rgba(224, 123, 123, 0.35); color: var(--danger); }
      .primary {
        width: 100%; padding: 14px 18px; border-radius: 999px; font-size: 15px; font-weight: 600;
        color: #1a120b; background: linear-gradient(180deg, #f0c894, #d9a56b);
        box-shadow: 0 12px 30px rgba(226, 181, 127, 0.18);
      }
      .primary:active { transform: scale(0.99); }
      .hint { font-size: 11px; line-height: 1.6; color: var(--muted); text-align: center; }
      .error { font-size: 11px; color: var(--danger); text-align: center; min-height: 16px; }
      .hidden { display: none !important; }
      .footer { display: flex; gap: 8px; align-items: center; justify-content: center; }
      .svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

      /* 悬浮窗里只有 ~390px 高：把球和字幕收紧，保证控件都露出来 */
      @media (max-height: 520px) {
        #app { padding: 8px 12px 12px; }
        .orb { width: 78px; height: 78px; }
        .transcript { max-height: 30vh; }
        .state { font-size: 11px; }
        .hint { display: none; }
        .round { width: 44px; height: 44px; }
        .primary { padding: 11px 16px; font-size: 14px; }
      }
      /* 悬浮窗外框已经有名字/计时/退出，页面自己的 header 就不重复了 */
      body.compact header { display: none !important; }
      body.compact #app { padding-top: 10px; }
      /* 悬浮窗里字幕再收一点，保证「接通 / 挂断」两个按钮始终在屏幕内 */
      body.compact .transcript { max-height: 22vh; }
      /* 结束后的「重新接通」按钮做小一号，避免和外框的「退出」抢注意力 */
      body.compact .primary { padding: 10px 16px; font-size: 14px; }
</style>
  </head>
  <body>
    <canvas id="sky"></canvas>
    <div id="app">
      <header>
        <span class="dot" id="dot"></span>
        <span class="brand">PAIVOICE</span>
        <span class="name" id="name">白起</span>
      </header>

      <main>
        <div class="stage">
          <div class="orb" id="orb"></div>
          <div class="state" id="state">准备接通</div>
          <div class="transcript" id="transcript"></div>
        </div>

        <div class="error" id="error"></div>

        <div id="start-wrap">
          <button class="primary" id="start">接通</button>
          <p class="hint" id="start-hint">麦克风只在通话期间开启，音频不落盘</p>
        </div>

        <div class="controls hidden" id="controls">
          <button class="round" id="mute" aria-label="静音">
            <svg class="svg" viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
          </button>
          <button class="round hangup" id="hangup" aria-label="挂断">
            <svg class="svg" viewBox="0 0 24 24"><path d="M3 10c5-4 13-4 18 0v3a2 2 0 0 1-2 2h-3l-1-3c-2-.5-4-.5-6 0l-1 3H5a2 2 0 0 1-2-2z"/></svg>
          </button>
        </div>
      </main>
    </div>

    <!-- 通话星空背景：移植自 third-party/ai-call-screen-share/particles-demo.html（上游无 LICENSE，仅作设计参考） -->
    <script>
      window.sky = (function () {
        const cv = document.getElementById('sky'), c2 = cv.getContext('2d');
        let W = 0, H = 0, N = 0, parts = [], mode = '';
        let phase = 'free', shapeIdx = -1, phaseT = 0, tPrev = 0, raf = 0, frame = 0;
        let rotY = 0, rotX = 0, zoom = 1, amp = 0, clock = 0;
        let lastTouch = -1e9, lastVoice = -1e9;
        const SPIN = 0.0038, FR = 74;
        const vo = { me: false, him: false, himOff: -1e9 };
        const fg = { on: false, x: 0, y: 0, vx: 0, vy: 0, sx: 0, sy: 0, st: 0, moved: 0 };
        const SHAPES = ['paw', 'planet', 'galaxy', 'dipper'];
        const NIGHT = ['#ffffff', '#cfdaff', '#ffd9a6', '#a9c9ff'];
        const DAY = ['#f4a8c4', '#f7bfd4', '#e8b6d6', '#f2cfa6'];
        const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
        const rnd = (a, b) => a + Math.random() * (b - a);
        const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) * 0.8;

        function genPaw(n) {
          const toes = [[-0.52, -0.30], [-0.18, -0.50], [0.18, -0.50], [0.52, -0.30]], pts = [];
          for (let i = 0; i < n; i++) {
            let cx, cy, rx, ry;
            if (i < n * 0.55) { cx = 0; cy = 0.34; rx = 0.44; ry = 0.36 } else { const t = toes[i % 4]; cx = t[0]; cy = t[1]; rx = 0.17; ry = 0.20 }
            const a = Math.random() * 6.283, rr = Math.sqrt(Math.random()), dome = Math.sqrt(Math.max(0, 1 - rr * rr));
            pts.push([cx + Math.cos(a) * rx * rr, cy + Math.sin(a) * ry * rr, (Math.random() < 0.5 ? 1 : -1) * 0.09 * dome + gauss() * 0.02]);
          }
          return pts;
        }
        function genPlanet(n) {
          const pts = [], ns = Math.floor(n * 0.58), ga = Math.PI * (3 - Math.sqrt(5));
          for (let i = 0; i < ns; i++) { const yy = 1 - 2 * (i + 0.5) / ns, rr = Math.sqrt(1 - yy * yy), th = ga * i; pts.push([Math.cos(th) * rr * 0.55, yy * 0.55, Math.sin(th) * rr * 0.55]) }
          const ct = Math.cos(0.5), st = Math.sin(0.5);
          for (let i = ns; i < n; i++) { const a = Math.random() * 6.283, r = rnd(0.72, 1.12), x = Math.cos(a) * r, z = Math.sin(a) * r, y = gauss() * 0.015; pts.push([x, y * ct - z * st, y * st + z * ct]) }
          return pts;
        }
        function genGalaxy(n) {
          const pts = [], nb = Math.floor(n * 0.14);
          for (let i = 0; i < nb; i++) { const a = Math.random() * 6.283, b = Math.acos(rnd(-1, 1)), r = 0.16 * Math.cbrt(Math.random()); pts.push([r * Math.sin(b) * Math.cos(a), r * Math.sin(b) * Math.sin(a) * 0.6, r * Math.cos(b)]) }
          for (let i = nb; i < n; i++) { const arm = (i % 2) ? 0 : Math.PI, t = Math.pow(Math.random(), 0.75) * 7.54, r = 0.14 + 0.9 * Math.pow(t / 7.54, 1.05), th = t * 0.85 + arm + gauss() * 0.14; pts.push([Math.cos(th) * r, Math.sin(th) * r, gauss() * 0.05 * (1.1 - r * 0.6)]) }
          return pts;
        }
        function genDipper(n) {
          const S = 1.35, A = [[0.58, -0.30], [0.62, 0.02], [0.30, 0.06], [0.28, -0.24], [0.0, -0.18], [-0.30, -0.10], [-0.60, 0.06]].map(p => [p[0] * S, p[1] * S]);
          const L = [[0, 1], [1, 2], [2, 3], [3, 0], [3, 4], [4, 5], [5, 6]], pts = [], nA = Math.floor(n * 0.22), nL = Math.floor(n * 0.40);
          for (let i = 0; i < nA; i++) { const s = A[i % 7]; pts.push([s[0] + gauss() * 0.035, s[1] + gauss() * 0.035, gauss() * 0.03]) }
          for (let i = 0; i < nL; i++) { const sg = L[i % 7], a = A[sg[0]], b = A[sg[1]], t = Math.random(); pts.push([a[0] + (b[0] - a[0]) * t + gauss() * 0.012, a[1] + (b[1] - a[1]) * t + gauss() * 0.012, gauss() * 0.02]) }
          for (let i = nA + nL; i < n; i++) pts.push([rnd(-1.15, 1.15), rnd(-1.15, 1.15), rnd(-0.5, 0.5)]);
          return pts;
        }
        const GEN = { paw: genPaw, planet: genPlanet, galaxy: genGalaxy, dipper: genDipper }, cache = {};
        const targetsFor = name => cache[name + N] || (cache[name + N] = GEN[name](N));

        function applyShape(i) {
          shapeIdx = ((i % SHAPES.length) + SHAPES.length) % SHAPES.length;
          const T = targetsFor(SHAPES[shapeIdx]);
          parts.forEach((p, k) => { const t = T[k % T.length]; p.tx = t[0]; p.ty = t[1]; p.tz = t[2] });
        }
        function toFree() { for (const p of parts) { p.tx = rnd(-1.4, 1.4); p.ty = rnd(-1.4, 1.4); p.tz = rnd(-0.9, 0.9) } }
        const isDark = () => document.documentElement.dataset.theme !== 'day';
        function build() {
          mode = isDark() ? 'night' : 'day';
          N = Math.round(Math.min(1000, Math.max(360, W * H / (mode === 'night' ? 380 : 560))));
          parts = [];
          for (let i = 0; i < N; i++) parts.push({
            x: rnd(-1.4, 1.4), y: rnd(-1.4, 1.4), z: rnd(-0.9, 0.9), tx: 0, ty: 0, tz: 0, ox: 0, oy: 0,
            vx: rnd(-1, 1) * 0.0007, vy: -rnd(0.0006, 0.0022), vz: rnd(-1, 1) * 0.0004,
            tw: Math.random() * 6.283, ts: rnd(0.6, 1.8), sz: mode === 'night' ? rnd(0.6, 1.9) : rnd(0.9, 2.4),
            cl: (mode === 'night' ? NIGHT : DAY)[Math.floor(Math.random() * 4)], d: Math.random()
          });
          if (formed()) applyShape(shapeIdx);
        }
        const formed = () => phase === 'form' || phase === 'hold';
        function snap() { for (const p of parts) { p.x = p.tx; p.y = p.ty; p.z = p.tz } phase = 'hold'; phaseT = 0; draw() }
        function gather(next) {
          if (formed() && !next) return;
          applyShape((next || shapeIdx < 0) ? shapeIdx + 1 : shapeIdx);
          if (reduce) return snap();
          phase = 'form'; phaseT = 0;
        }
        function voice(who, on) {
          const now = performance.now();
          if (who === 'him') {
            if (on && !vo.him && (!formed() || now - vo.himOff > 2500)) gather(true);
            if (!on && vo.him) vo.himOff = now;
            vo.him = on;
          } else {
            if (on && !vo.me && !formed()) gather(false);
            vo.me = on;
          }
          lastVoice = now;
        }
        function tap() { lastTouch = performance.now(); gather(formed()) }
        function step(dt) {
          phaseT += dt; clock += dt;
          const now = performance.now(), touched = now - lastTouch < 25000;
          if (phase === 'form' && phaseT > 3.2) { phase = 'hold'; phaseT = 0 }
          else if (phase === 'hold' && !vo.me && !vo.him && now - lastVoice > 40000 && !touched) { toFree(); phase = 'melt'; phaseT = 0 }
          else if (phase === 'melt' && phaseT > 3) {
            phase = 'free'; phaseT = 0;
            for (const p of parts) { p.vx = rnd(-1, 1) * 0.0007; p.vy = -rnd(0.0006, 0.0022); p.vz = rnd(-1, 1) * 0.0004 }
          }
          const want = vo.him ? 1 : (vo.me ? 0.55 : 0);
          amp += (want - amp) * Math.min(1, dt * 2.5);
          if (!touched && formed()) rotY += SPIN * dt * 30 * (1 + amp * 0.6);
          for (const p of parts) {
            if (phase === 'free') {
              p.x += p.vx * dt * 60; p.y += p.vy * dt * 60; p.z += p.vz * dt * 60;
              if (p.y < -1.5) p.y = 1.5; if (p.x < -1.5) p.x = 1.5; if (p.x > 1.5) p.x = -1.5; if (p.z < -1) p.z = 1; if (p.z > 1) p.z = -1;
            } else {
              const k = phase === 'form' ? Math.max(0, Math.min(1, phaseT * 1.6 - p.d)) * 0.075 : 0.075;
              p.x += (p.tx - p.x) * k; p.y += (p.ty - p.y) * k; p.z += (p.tz - p.z) * k;
            }
          }
          fg.vx *= 0.7; fg.vy *= 0.7;
        }
        function star4(x, y, r) { c2.beginPath(); c2.moveTo(x, y - r); c2.quadraticCurveTo(x, y, x + r, y); c2.quadraticCurveTo(x, y, x, y + r); c2.quadraticCurveTo(x, y, x - r, y); c2.quadraticCurveTo(x, y, x, y - r); c2.fill() }
        function draw() {
          c2.clearRect(0, 0, W, H);
          const cy = Math.cos(rotY), sy = Math.sin(rotY), cx = Math.cos(rotX), sx = Math.sin(rotX);
          const breathe = 1 + amp * (0.03 + 0.04 * Math.sin(clock * (vo.him ? 6.5 : 4.5)));
          const S = Math.min(W, H) * 0.34 * zoom * breathe, CX = W / 2, CY = H * 0.46, F = 3.1, night = mode === 'night';
          const R2 = FR * FR, tws = 0.02 * (1 + amp * 1.2);
          for (const p of parts) {
            const X = p.x * cy + p.z * sy, Z0 = p.z * cy - p.x * sy, Y2 = p.y * cx - Z0 * sx, Z2 = p.y * sx + Z0 * cx;
            const pr = F / (F + Z2); if (pr <= 0) continue;
            let px = CX + X * S * pr, py = CY + Y2 * S * pr;
            if (fg.on) {
              const dx = px + p.ox - fg.x, dy = py + p.oy - fg.y, d2 = dx * dx + dy * dy;
              if (d2 < R2) { const d = Math.sqrt(d2) || 1, f = 1 - d / FR; p.ox += dx / d * f * f * 15 + fg.vx * f * 0.35; p.oy += dy / d * f * f * 15 + fg.vy * f * 0.35 }
            }
            if (p.ox || p.oy) { p.ox *= 0.9; p.oy *= 0.9; if (Math.abs(p.ox) < 0.05) p.ox = 0; if (Math.abs(p.oy) < 0.05) p.oy = 0 }
            px += p.ox; py += p.oy;
            if (px < -8 || px > W + 8 || py < -8 || py > H + 8) continue;
            c2.globalAlpha = (0.35 + 0.65 * Math.abs(Math.sin(p.tw += tws * p.ts))) * Math.max(0.15, Math.min(1, pr * pr * 0.9));
            c2.fillStyle = p.cl;
            const sz = p.sz * pr;
            if (!night && sz > 2.0) star4(px, py, sz * 1.9);
            else if (sz < 1.4) { const q = Math.max(0.8, sz); c2.fillRect(px, py, q, q) }
            else { c2.beginPath(); c2.arc(px, py, sz * 0.62, 0, 6.283); c2.fill() }
          }
          c2.globalAlpha = 1;
        }
        function tick(ts) {
          raf = 0;
          frame++; if (frame & 1) { raf = requestAnimationFrame(tick); return }
          const dt = Math.min(0.1, ((ts - tPrev) / 1000) || 0.033); tPrev = ts;
          step(dt); draw(); raf = requestAnimationFrame(tick);
        }
        function resize() {
          const d = Math.min(2, devicePixelRatio || 1);
          W = cv.clientWidth || innerWidth; H = cv.clientHeight || innerHeight;
          cv.width = Math.round(W * d); cv.height = Math.round(H * d); c2.setTransform(d, 0, 0, d, 0, 0);
        }
        const g = { pt: null, d0: 0, rY: 0, rX: 0, z0: 1, multi: false };
        function fDown(x, y) { const now = performance.now(); Object.assign(fg, { on: true, x, y, sx: x, sy: y, vx: 0, vy: 0, st: now, moved: 0 }); lastTouch = now }
        function fMove(x, y) { if (!fg.on) return; fg.vx = x - fg.x; fg.vy = y - fg.y; fg.x = x; fg.y = y; fg.moved = Math.max(fg.moved, Math.hypot(x - fg.sx, y - fg.sy)); lastTouch = performance.now() }
        function fUp() { if (!fg.on) return; fg.on = false; if (!g.multi && fg.moved < 12 && performance.now() - fg.st < 320) tap() }
        cv.addEventListener('touchstart', e => {
          if (e.touches.length >= 2) {
            g.multi = true; fg.on = false; const a = e.touches[0], b = e.touches[1];
            g.pt = { x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 }; g.d0 = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
            g.rY = rotY; g.rX = rotX; g.z0 = zoom; lastTouch = performance.now();
          } else { g.multi = false; fDown(e.touches[0].clientX, e.touches[0].clientY) }
          e.preventDefault();
        }, { passive: false });
        cv.addEventListener('touchmove', e => {
          if (e.touches.length >= 2 && g.pt) {
            const a = e.touches[0], b = e.touches[1], mx = (a.clientX + b.clientX) / 2, my = (a.clientY + b.clientY) / 2;
            rotY = g.rY + (mx - g.pt.x) * 0.006; rotX = Math.max(-1.3, Math.min(1.3, g.rX + (my - g.pt.y) * 0.006));
            zoom = Math.max(0.55, Math.min(2.4, g.z0 * (Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) / (g.d0 || 1))));
            lastTouch = performance.now();
          } else if (e.touches.length === 1) fMove(e.touches[0].clientX, e.touches[0].clientY);
          e.preventDefault();
        }, { passive: false });
        cv.addEventListener('touchend', e => { if (e.touches.length < 2) g.pt = null; if (!e.touches.length) fUp() });
        cv.addEventListener('mousedown', e => { g.multi = false; fDown(e.clientX, e.clientY) });
        addEventListener('mousemove', e => fMove(e.clientX, e.clientY));
        addEventListener('mouseup', fUp);
        function start() { resize(); build(); tPrev = performance.now(); if (reduce) { applyShape(1); snap(); return } raf = requestAnimationFrame(tick) }
        function stop() { cancelAnimationFrame(raf); raf = 0 }
        addEventListener('resize', () => { resize(); build() });
        document.addEventListener('visibilitychange', () => { if (document.hidden) stop(); else if (!raf && !reduce) { tPrev = performance.now(); raf = requestAnimationFrame(tick) } });
        return { start, stop, voice, tap, rebuild: build, form(i) { applyShape(i); lastTouch = performance.now(); snap() } };
      })();
      try { window.sky.start(); } catch (e) { console.warn('starfield init failed', e); }
    </script>

    <script type="module">
      import VoiceCall from './voice-call.js';

      const q = new URLSearchParams(location.search);
      const ws = q.get('ws') || 'ws://127.0.0.1:8780';
      const video = q.get('video') === '1';
      const name = q.get('name') || '白起';
      if (q.get('compact') === '1') document.body.classList.add('compact');

      const $ = (id) => document.getElementById(id);
      $('name').textContent = name;

      const orb = $('orb');
      const dot = $('dot');
      const stateEl = $('state');
      const transcript = $('transcript');
      const errorEl = $('error');
      const startWrap = $('start-wrap');
      const controls = $('controls');
      let call = null;
      let muted = false;

      const LABEL = {
        idle: '待接通',
        listening: '在听你说',
        thinking: '在想…',
        speaking: '正在说',
        reconnecting: '断线重连中…',
        closed: '已挂断',
      };

      let prevMode = '';
      function setMode(mode) {
        stateEl.textContent = LABEL[mode] || mode || '';
        orb.className = `orb ${mode || ''}`;
        dot.className = `dot ${mode === 'idle' || mode === 'closed' ? '' : 'on'}`;
        // 通话星空：AI 开口聚形、收声散开
        if (window.sky) {
          if (mode === 'speaking') window.sky.voice('him', true);
          else if (prevMode === 'speaking') window.sky.voice('him', false);
        }
        prevMode = mode;
        if (mode === 'closed') {
          startWrap.classList.remove('hidden');
          controls.classList.add('hidden');
        }
        window.parent?.postMessage({ type: 'paivoice:state', mode }, '*');
      }

      function addBubble(kind, text) {
        const t = String(text || '').trim();
        if (!t) return;
        const el = document.createElement('div');
        el.className = `bubble ${kind}`;
        el.textContent = t;
        transcript.appendChild(el);
        transcript.scrollTop = transcript.scrollHeight;
      }

      function fail(msg) {
        errorEl.textContent = String(msg || '');
      }

      $('start').addEventListener('click', async () => {
        fail('');
        errorEl.textContent = '';
        transcript.innerHTML = '';
        addBubble('sys', video ? '画面只给 TA 看，不会录下来' : '音频不落盘');
        call = new VoiceCall({
          url: ws,
          video,
          on: {
            state: (m) => setMode(m),
            speech: (v) => { if (window.sky) window.sky.voice('me', !!v); },
            transcript: (msg) => addBubble('me', msg?.text),
            reply: (msg) => addBubble('ai', msg?.text),
            error: (e) => fail(e),
            reconnecting: () => setMode('reconnecting'),
            resumed: () => setMode('listening'),
            closed: () => {
              setMode('closed');
              window.parent?.postMessage({ type: 'paivoice:end' }, '*');
            },
          },
        });
        startWrap.classList.add('hidden');
        controls.classList.remove('hidden');
        setMode('thinking');
        try {
          await call.start();
          setMode('listening');
        } catch (e) {
          fail(e?.message || String(e));
          setMode('idle');
          startWrap.classList.remove('hidden');
          controls.classList.add('hidden');
        }
      });

      $('mute').addEventListener('click', async () => {
        if (!call) return;
        muted = !muted;
        try {
          await call.setMuted(muted);
          $('mute').classList.toggle('on', muted);
          $('mute').setAttribute('aria-label', muted ? '取消静音' : '静音');
        } catch (e) {
          fail(e?.message || String(e));
        }
      });

      $('hangup').addEventListener('click', () => {
        try {
          call?.hangup();
        } catch {
          /* ignore */
        }
        setMode('closed');
        window.parent?.postMessage({ type: 'paivoice:end' }, '*');
      });
    </script>
  </body>
</html>
