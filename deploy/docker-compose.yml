# 小蓝莓双端部署编排：backend（Fastify + SQLite） + frontend（nginx 托管 SPA + 反代）。
# 在仓库根执行：docker compose -f deploy/docker-compose.yml up -d --build
services:
  backend:
    build:
      context: ../后端
      dockerfile: Dockerfile
    container_name: blueberry-backend
    restart: unless-stopped
    environment:
      PORT: "3001"
      DATABASE_PATH: /app/data/blueberry.db
      # —— 模型服务（改成你的实际值；不填 Key 则用默认）——
      # 本地 Ollama 在 VPS 上时，容器内不能用 localhost，用宿主机地址：
      #   OPENAI_BASE_URL: http://host.docker.internal:11434/v1
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://localhost:11434/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-qwen2.5:7b}
      # 智能编程工作区（阶段 10）：如需在 VPS 上跑编程 agent，挂载一个代码目录
      WORKSPACE_PATH: /workspace
    volumes:
      - blueberry_data:/app/data
      # 可选：挂载要交给编程 agent 的代码目录
      # - /path/to/your/repo:/workspace
    # 端口只对内网前端暴露，不直接开到公网
    expose:
      - "3001"

  frontend:
    build:
      context: ../前端
      dockerfile: Dockerfile
    container_name: blueberry-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      # HTTPS 就绪后放开：
      # - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # certbot 签发后的证书目录：
      # - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - backend

volumes:
  blueberry_data:
