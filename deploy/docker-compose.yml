# 小蓝莓 · Host 模式部署编排（阶段 P1）：
# 单容器交付——后端（Fastify + SQLite）直接把前端 dist 托管起来，
# 一个端口就是完整应用，适合「轻量单机 + 独立 Host」的形态：
# 本机 / 局域网小主机 / 一台 VPS 都行，数据全在自己机器上。
#
# 在仓库根执行：
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# 完成后访问 http://localhost:3001/ 即是完整 App（API 同源，无需再配代理）。
services:
  blueberry:
    build:
      context: ..
      dockerfile: 后端/Dockerfile
    image: blueberry:host
    container_name: blueberry-host
    restart: unless-stopped
    ports:
      # 单端口：页面 + API 都从这里进
      - "3001:3001"
    environment:
      PORT: "3001"
      DATABASE_PATH: /app/data/blueberry.db
      # —— 模型服务（改成你的实际值；不填 Key 则用默认）——
      # 本地 Ollama 在宿主机上时，容器内不能用 localhost，用：
      #   OPENAI_BASE_URL: http://host.docker.internal:11434/v1
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://localhost:11434/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-qwen2.5:7b}
      # 智能编程工作区：如需跑编程 agent，挂载一个代码目录
      WORKSPACE_PATH: /workspace
    volumes:
      - blueberry_data:/app/data
      # 可选：挂载要交给编程 agent 的代码目录
      # - /path/to/your/repo:/workspace

volumes:
  blueberry_data:
