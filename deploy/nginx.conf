# 小蓝莓生产 nginx 配置：托管前端静态资源 + 反代 /api 到后端。
# 运行时挂载到 /etc/nginx/conf.d/default.conf（见 docker-compose.yml）。

# 后端服务名（docker-compose 内网 DNS）
upstream blueberry_backend {
    server backend:3001;
}

server {
    listen 80;
    server_name _;  # 换成你的域名，如 blueberry.example.com

    root /usr/share/nginx/html;
    index index.html;

    # 发图上传最大 8MB，留点余量
    client_max_body_size 10m;

    # SPA 前端：找不到文件回退到 index.html，交给 React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API 反代到后端（API Key 只在后端，绝不经过浏览器暴露）
    location /api/ {
        proxy_pass http://blueberry_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式响应：关闭缓冲，保证逐字上屏 / 工具调用实时返回
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

